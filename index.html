```html
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minha RA no GitHub</title>
    <!-- Carrega as bibliotecas do MindAR e A-Frame -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- A cena 3D que vai reconhecer a imagem e mostrar o conteúdo -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Câmera do usuário -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Alvo de imagem que será rastreado -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- AQUI VOCÊ SUBSTITUI PELO SEU CONTEÚDO -->
        <!-- Exemplo com um modelo 3D (substitua pelo seu) -->
        <a-entity
          position="0 0 0"
          scale="0.05 0.05 0.05"
        >
          <a-gltf-model src="./meu-modelo.glb"></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
